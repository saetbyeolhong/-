<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 폼 만들기</title>
</head>
<body>
    <!-- 문자입력하기 -->
    <p><b>&lt;input&gt;</b><br>
    <input></p>
    <p><b>type="text" + 추가속성</b><br>
    <input type="text" value="HTML"
        maxlength="30" size="30"></p>
    <p><b>type="text" & type="password"</b><br>
    <input type="text" placeholder="아이디"><br>
    <input type="password" placeholder="비밀번호"></p>
    <p><b>여러 줄 문자 입력 : &lt;textarea&gt;</b><br>
    <textarea rows="5">문자</textarea></p>
    <hr>

    <!-- 옵션이 있는 문자 입력하기 -->
    <p>키우고 싶은 동물은</p>
    <input type="text" list="animal">
    <datalist id="animal">
        <option value="개"></option>
        <option value="고양이"></option>
        <option value="오리"></option>
        <option value="코알라"></option>
    </datalist>
    <p>키우고 싶은 장소는</p>
    <input type="text" list="place">
    <datalist id="place">
        <option value="내방"></option>
        <option value="거실"></option>
        <option value="안방"></option>
        <option value="마당"></option>
    </datalist>
    <p>키우고 싶은 동물은</p>
    <select>
        <option value="dog">개</option>
        <option value="cat">고양이</option>
        <option value="duck">오리</option>
        <option value="koala">코알라</option>
    </select>
    <hr>

    <!-- 단일 선택과 복수 선택 입력하기 -->
    <p>원하는 동물의 무료 입장권을 드립니다.(단일 선택)</p>
    <input type="radio" name="ticket" value="1">서울대공원
    <input type="radio" name="ticket" value="2">어린이대공원
    <input type="radio" name="ticket" value="3" checked>에버랜드
    <br><br>
    <p>동물원에서 보고 싶은동물을 고르세요.(복수선택)</p>
    <input type="checkbox" name="prefer" value="1">판다
    <input type="checkbox" name="prefer" value="2">하마
    <input type="checkbox" name="prefer" value="3">라마
    <hr>

    <!-- 숫자 입력하기 -->
    <p>키우고 싶은 고양이는 몇 마리?</p>
     고양이<input type="number" min="0" max="10" step="1"> 마리 키우고 싶어요.
    <br><br>
    <p>고양이가 한 번에 먹는 사료량은 몇 g?</p>
    <input type="range" max="100" value="80" step="10">
    <hr>

    <!-- 다양한 버튼 만들기 -->
    <p>단순 버튼 : <input type="button" value="in_tag">
    <button type="button">bu_tag</button><br></p>
    <p>제출 버튼 : <input type="submit" value="in_submit">
    <button type="submit">bu_submit</button><br></p>
    <p>리셋 버튼 : <input type="reset" value="in_reset">
    <button type="reset">bu_reset</button><br></p>
    <hr>

    <!-- 날짜와 시간 입력하기 -->
    <p><input type="month" value="2024-03"></p>
    <p><input type="week" value="2024-w15"></p>
    <p><input type="date" value="2024-03-02"></p>
    <p><input type="datetime-local"></p>
    <p><input type="time" value="19:00:00" min="17:00:00" max="24:00:00"></p>
    <hr>
    
    <!-- 파일 업로드와 색상 입력하기 -->
    <label>좋아하는 동물 이미지를 고르세요:<br>
        <input type="file" id="profile" accept="image/png, image/jpeg">
    </label><br><br>
    <label>선택한 동물을 설명하는 문서 파일업을 업로드하세요:<br>
        <input type="file" id="word" accept=".hwp, hwpx,application/msword">
    </label><br><br>
    <label>선택한 동물과 어울리는 색상을 찾으세요: <input type="color" id="color">
    </label>
    <hr>
</body>
</html>
